name: Windows-kiadás

# Egy v* címke (pl. v5.0.0) felküldése elkészíti a telepítőt és a hordozható exe-t,
# és csatolja őket a GitHub Release-hez. A leírás a CHANGELOG.md megfelelő szakaszából jön.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tesztek
        run: python -m pytest -q

      - name: Verzió ellenőrzése
        id: ver
        shell: pwsh
        run: |
          $v = python packaging/make_version_info.py --print
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "A címke (${{ github.ref_name }}) nem egyezik a csomag verziójával (v$v)."
          }

      - name: PyInstaller (mappás + hordozható)
        shell: pwsh
        run: |
          pyinstaller packaging/pycleaner.spec --noconfirm --clean
          $env:PYC_ONEFILE = "1"
          pyinstaller packaging/pycleaner.spec --noconfirm

      - name: Füstteszt — az exe elindul és kiszolgál
        shell: pwsh
        run: |
          $p = Start-Process dist\PyCleaner\PyCleaner.exe -ArgumentList "--no-open","--port","5199" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try { $r = Invoke-WebRequest http://127.0.0.1:5199/ -UseBasicParsing -TimeoutSec 2; if ($r.Content -match 'pyc-token') { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\PyCleaner\pycleaner.log" -ErrorAction SilentlyContinue; throw "Az exe nem indult el." }

      - name: Füstteszt — natív ablak (WebView2)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\PyCleaner\pycleaner.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process dist\PyCleaner\PyCleaner.exe -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "natív ablak fut" -Quiet)) { $ok = $true; break }
          }
          Get-Content $log -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "A natív ablak nem indult el." }

      - name: Telepítő (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup hiba" }

      - name: Kiadási fájlok
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "dist\PyCleaner-$v-Setup.exe" release\
          Copy-Item dist\PyCleaner-portable.exe "release\PyCleaner-$v-portable.exe"
          Compress-Archive dist\PyCleaner\* "release\PyCleaner-$v-win64.zip"
          Get-ChildItem release | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content release\SHA256SUMS.txt -Encoding ascii
          # a CHANGELOG adott verziójú szakasza lesz a kiadás leírása
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?$\r?\n(.*?)(?=^## |\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "PyCleaner $v" }
          Set-Content release-notes.md $body -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: PyCleaner-${{ steps.ver.outputs.version }}
          path: release/

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" release/* --title "PyCleaner ${{ steps.ver.outputs.version }}" --notes-file release-notes.md
