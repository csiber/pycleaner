name: Windows-kiadás

# Egy v* címke (pl. v5.0.0) felküldése elkészíti a telepítőt és a hordozható exe-t,
# és csatolja őket a GitHub Release-hez. A leírás a CHANGELOG.md megfelelő szakaszából jön.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Aláírás csak akkor, ha a SignPath be van állítva (lásd .signpath/README.md) — addig aláíratlan a kiadás.
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tesztek
        run: python -m pytest -q

      - name: Verzió ellenőrzése
        id: ver
        shell: pwsh
        run: |
          $v = python packaging/make_version_info.py --print
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "A címke (${{ github.ref_name }}) nem egyezik a csomag verziójával (v$v)."
          }

      - name: PyInstaller (mappás + hordozható)
        shell: pwsh
        run: |
          pyinstaller packaging/pycleaner.spec --noconfirm --clean
          $env:PYC_ONEFILE = "1"
          pyinstaller packaging/pycleaner.spec --noconfirm

      - name: Füstteszt — az exe elindul és kiszolgál
        shell: pwsh
        run: |
          $p = Start-Process dist\PyCleaner\PyCleaner.exe -ArgumentList "--no-open","--port","5199" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            try { $r = Invoke-WebRequest http://127.0.0.1:5199/ -UseBasicParsing -TimeoutSec 2; if ($r.Content -match 'pyc-token') { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\PyCleaner\pycleaner.log" -ErrorAction SilentlyContinue; throw "Az exe nem indult el." }

      - name: Füstteszt — natív ablak (WebView2)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\PyCleaner\pycleaner.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process dist\PyCleaner\PyCleaner.exe -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "natív ablak fut" -Quiet)) { $ok = $true; break }
          }
          Get-Content $log -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "A natív ablak nem indult el." }

      # ── kódaláírás 1/2: a program exe-i (a telepítő már az aláírt exe-t csomagolja) ──
      - name: Aláíratlan exe-k feltöltése
        id: up_bin
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            dist/PyCleaner/PyCleaner.exe
            dist/PyCleaner-portable.exe
          if-no-files-found: error

      - name: Aláírás (SignPath) — exe-k
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pycleaner' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.up_bin.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-bin

      - name: Aláírt exe-k visszahelyezése
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-bin\PyCleaner\PyCleaner.exe dist\PyCleaner\PyCleaner.exe -Force
          Copy-Item signed-bin\PyCleaner-portable.exe dist\PyCleaner-portable.exe -Force

      - name: Telepítő (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup hiba" }

      # ── kódaláírás 2/2: a telepítő ──
      - name: Telepítő előkészítése aláírásra
        id: up_setup
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory unsigned-setup | Out-Null
          Copy-Item "dist\PyCleaner-${{ steps.ver.outputs.version }}-Setup.exe" unsigned-setup\PyCleaner-Setup.exe

      - name: Aláíratlan telepítő feltöltése
        id: up_setup_art
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: unsigned-setup/PyCleaner-Setup.exe
          if-no-files-found: error

      - name: Aláírás (SignPath) — telepítő
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pycleaner' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.up_setup_art.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Aláírások ellenőrzése
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-setup\PyCleaner-Setup.exe "dist\PyCleaner-${{ steps.ver.outputs.version }}-Setup.exe" -Force
          $files = @("dist\PyCleaner\PyCleaner.exe", "dist\PyCleaner-portable.exe", "dist\PyCleaner-${{ steps.ver.outputs.version }}-Setup.exe")
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} — {2}" -f $f, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "Érvénytelen aláírás: $f" }
          }

      - name: Kiadási fájlok
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "dist\PyCleaner-$v-Setup.exe" release\
          Copy-Item dist\PyCleaner-portable.exe "release\PyCleaner-$v-portable.exe"
          Compress-Archive dist\PyCleaner\* "release\PyCleaner-$v-win64.zip"
          Get-ChildItem release | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content release\SHA256SUMS.txt -Encoding ascii
          # a CHANGELOG adott verziójú szakasza lesz a kiadás leírása
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?$\r?\n(.*?)(?=^## |\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "PyCleaner $v" }
          Set-Content release-notes.md $body -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: PyCleaner-${{ steps.ver.outputs.version }}${{ env.SIGNING != 'true' && '-alairatlan' || '' }}
          path: release/

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" release/* --title "PyCleaner ${{ steps.ver.outputs.version }}" --notes-file release-notes.md
