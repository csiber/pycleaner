<!doctype html>
<html lang="hu" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="pyc-token" content="{{ token }}">
  <meta name="color-scheme" content="dark light">
  <title>PyCleaner</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body class="{{ 'native' if native else 'browser' }}">
<div class="shell">
  <aside class="side">
    <div class="brand">
      <img src="/static/logo.svg" alt="" width="30" height="30">
      <div><b>PyCleaner</b><span>v{{ version }}</span></div>
    </div>
    <nav id="nav" aria-label="Menu">
      <a data-page="overview" class="active"><svg class="ic"><use href="/static/icons.svg#i-layout-dashboard"/></svg><span data-i18n>Áttekintés</span></a>
      <a data-page="cleaner"><svg class="ic"><use href="/static/icons.svg#i-sparkles"/></svg><span data-i18n>Tisztítás</span><em id="pillClean"></em></a>
      <a data-page="monitor"><svg class="ic"><use href="/static/icons.svg#i-activity"/></svg><span data-i18n>Élő monitor</span><em id="pillCpu" class="quiet"></em></a>
      <div class="nav-sec" data-i18n>Elemzés</div>
      <a data-page="disk"><svg class="ic"><use href="/static/icons.svg#i-hard-drive"/></svg><span data-i18n>Lemezelemző</span></a>
      <a data-page="dupes"><svg class="ic"><use href="/static/icons.svg#i-copy"/></svg><span data-i18n>Duplikátumok</span></a>
      <div class="nav-sec win-only" data-i18n>Gép karbantartása</div>
      <a data-page="health" class="win-only"><svg class="ic"><use href="/static/icons.svg#i-heart-pulse"/></svg><span data-i18n>Gépállapot</span><em id="pillHealth" class="quiet"></em></a>
      <a data-page="startup" class="win-only"><svg class="ic"><use href="/static/icons.svg#i-rocket"/></svg><span data-i18n>Indítópult</span></a>
      <a data-page="updates" class="win-only"><svg class="ic"><use href="/static/icons.svg#i-circle-arrow-up"/></svg><span data-i18n>Programfrissítő</span><em id="pillUpd"></em></a>
      <a data-page="programs" class="win-only"><svg class="ic"><use href="/static/icons.svg#i-package"/></svg><span data-i18n>Programok</span></a>
      <a data-page="registry" class="win-only"><svg class="ic"><use href="/static/icons.svg#i-list-tree"/></svg><span data-i18n>Registry</span></a>
      <a data-page="tweaks" class="win-only"><svg class="ic"><use href="/static/icons.svg#i-wrench"/></svg><span data-i18n>Finomhangolás</span></a>
      <div class="nav-sec" data-i18n>Karbantartás</div>
      <a data-page="schedule"><svg class="ic"><use href="/static/icons.svg#i-clock"/></svg><span data-i18n>Ütemező</span><em id="pillSched" class="quiet"></em></a>
      <a data-page="history"><svg class="ic"><use href="/static/icons.svg#i-history"/></svg><span data-i18n>Előzmények</span></a>
      <a data-page="settings"><svg class="ic"><use href="/static/icons.svg#i-settings"/></svg><span data-i18n>Beállítások</span><em id="pillUpdate" class="dot" hidden></em></a>
    </nav>
    <div class="side-foot">
      <button class="profile-btn" id="profileBtn">
        <svg class="ic"><use href="/static/icons.svg#i-user"/></svg><span id="profileName">—</span>
      </button>
      <div class="side-row">
        <span class="chip" id="adminChip">—</span>
        <button class="icon-btn" id="themeBtn"><svg class="ic"><use href="/static/icons.svg#i-moon"/></svg></button>
        <button class="icon-btn danger" id="exitBtn"><svg class="ic"><use href="/static/icons.svg#i-power"/></svg></button>
      </div>
    </div>
  </aside>

  <main id="main">
    <section class="page active" id="page-overview"></section>
    <section class="page" id="page-cleaner"></section>
    <section class="page" id="page-monitor"></section>
    <section class="page" id="page-disk"></section>
    <section class="page" id="page-dupes"></section>
    <section class="page" id="page-health"></section>
    <section class="page" id="page-startup"></section>
    <section class="page" id="page-updates"></section>
    <section class="page" id="page-programs"></section>
    <section class="page" id="page-registry"></section>
    <section class="page" id="page-tweaks"></section>
    <section class="page" id="page-schedule"></section>
    <section class="page" id="page-history"></section>
    <section class="page" id="page-settings"></section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<div class="goodbye" id="goodbye" hidden>
  <img src="/static/logo.svg" alt="" width="56" height="56">
  <h2 data-i18n>A PyCleaner leállt</h2>
  <p data-i18n>Ezt a lapot nyugodtan bezárhatod.</p>
</div>
<script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
